<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="720" height="360" rx="16" fill="#f5f4ef"/>

  <!-- chat text with a selection -->
  <text x="48" y="64" font-size="17" fill="#3d3a33">The</text>
  <rect x="84" y="46" width="80" height="25" rx="4" fill="#b9d4ff"/>
  <text x="88" y="64" font-size="17" fill="#1f1d19">animation</text>
  <text x="170" y="64" font-size="17" fill="#3d3a33">sprite sheet keeps the frames in one texture,</text>
  <text x="48" y="92" font-size="17" fill="#3d3a33">so the game draws the whole loop in a single call.</text>

  <!-- pointer -->
  <path d="M128 56 l0 20 l5 -5 l4 9 l3 -1.5 l-4 -9 l7 0 z" fill="#1f1d19" stroke="#fff" stroke-width="1.2"/>

  <!-- context menu -->
  <g filter="url(#shadow)">
    <rect x="156" y="104" width="380" height="216" rx="10" fill="#ffffff" stroke="#e2dfd6"/>
  </g>
  <text x="176" y="136" font-size="15" fill="#9a968c">Copy</text>
  <text x="176" y="166" font-size="15" fill="#9a968c">Select all</text>
  <line x1="168" y1="182" x2="524" y2="182" stroke="#ece9e1"/>

  <rect x="164" y="190" width="364" height="56" rx="7" fill="#eef4ff"/>
  <text x="182" y="214" font-size="15" fill="#1f1d19" font-weight="600">Look up "animation"</text>
  <text x="182" y="234" font-size="13" fill="#6f6b62">Dictionary meaning</text>

  <text x="182" y="276" font-size="15" fill="#1f1d19" font-weight="600">Search Google for "animation"</text>
  <text x="182" y="298" font-size="13" fill="#6f6b62">Opens in your default browser</text>

  <!-- callouts -->
  <g font-size="13" fill="#c2410c">
    <line x1="536" y1="160" x2="572" y2="160" stroke="#c2410c" stroke-dasharray="3 3"/>
    <text x="580" y="156">the app's own</text>
    <text x="580" y="172">rows</text>
    <line x1="536" y1="250" x2="572" y2="250" stroke="#c2410c" stroke-dasharray="3 3"/>
    <text x="580" y="246">added by</text>
    <text x="580" y="262">this mod</text>
  </g>
</svg>
